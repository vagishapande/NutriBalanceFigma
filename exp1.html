<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./globalexp1.css" />
    <link rel="stylesheet" href="./exp1.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap"
    />
  </head>
  <body>
    <div class="explore1">
      <main class="images">
        <section class="vector-parent">
          <img class="frame-child" alt="" src="./images/Rectangle-4169.svg" />

          <img class="vegbowl-1-icon" alt="" src="./images/vegbowl-1@2x.png" />

          <img class="curd-1-icon" alt="" src="./images/curd-1@2x.png" />

          <img class="palak-2-icon" alt="" src="./images/palak-2@2x.png" />

          <img
            class="palak-3-icon"
            loading="lazy"
            alt=""
            src="./images/palak-2@2x.png"
          />

          <img
            class="honey-1-icon"
            loading="lazy"
            alt=""
            src="./images/honey-1@2x.png"
          />

          <img
            class="cherry-1-icon"
            loading="lazy"
            alt=""
            src="./images/cherry-1@2x.png"
          />

          <div class="spoon">
            <img class="knife-1-icon" alt="" src="./images/knife-1@2x.png" />

            <img
              class="knife-2-icon"
              loading="lazy"
              alt=""
              src="./images/knife-2@2x.png"
            />
          </div>
        </section>
      </main>
      <header class="nutribalance-parent">
        <h1 class="nutribalance">
          <span>Nutri</span>
          <span class="balance">Balance</span>
        </h1>
        <nav class="home-parent">
          <h3 class="home" id="homeText">Home</h3>
          <h3 class="explore">Explore</h3>
          <h3 class="aboutus" id="aboutUsText">AboutUs</h3>
        </nav>
        <div class="sign-in-parent">
          <button class="sign-in">Sign In</button>
          <button class="signforfree">SignForFree</button>
        </div>
      </header>
      <section class="explore1-inner">
        <div class="frame-parent">
          <div class="eat-smart-fuel-your-body-righ-wrapper">
            <h1 class="eat-smart-fuel-your-body-container">
              <span>Eat smart!<br />Fuel </span>
              <span class="balance">your body right!</span>
            </h1>
          </div>
          <div class="tell-us-your-nutritional-defic-parent">
            <div class="tell-us-your">
              Tell us your nutritional deficiencies and health goals — we'll
              suggest the exact foods your body needs.
            </div>
            <div class="search-bar-wrapper">
              <div class="search-bar">
                <div class="search-parent">
                  <img class="search-icon" alt="" src="./images/search.svg" />

                  <div class="enter-your-health">Enter your health goals</div>
                </div>
                <button class="go-wrapper" id="frameButton">
                  <div class="go">Go</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      var homeText = document.getElementById("homeText");
      if (homeText) {
        homeText.addEventListener("click", function (e) {
          window.location.href="home.html";
        });
      }

      var aboutUsText = document.getElementById("aboutUsText");
      if (aboutUsText) {
        aboutUsText.addEventListener("click", function (e) {
          window.location.href="aboutus.html";
        });
      }

      var frameButton = document.getElementById("frameButton");
      if (frameButton) {
        frameButton.addEventListener("click", function (e) {
          window.location.href="exp2.html";
        });
      }
    </script>
  </body>
</html>
