<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />

    <link rel="stylesheet" href="./globalhome.css" />
    <link rel="stylesheet" href="./home.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap"
    />
  </head>
  <body>
    <div class="home">
      <header class="header">
        <h1 class="nutribalance">
          <span>Nutri</span>
          <span class="balance">Balance</span>
        </h1>
        <nav class="menu">
          <h3 class="home2">Home</h3>
          <h3 class="explore" id="exploreText">Explore</h3>
          <h3 class="explore" id="aboutUsText">About Us</h3>
        </nav>
        <div class="call-to-action">
          <button class="sign-in" id="signInText">Sign In</button>
          <button class="signforfree" id="signForFreeText">
            Sign For Free
          </button>
        </div>
        <button
          class="hamburger"
          id="hamburgerBtn"
          aria-label="Open navigation menu"
          aria-expanded="false"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </header>

      <!-- Mobile navigation overlay -->
      <div
        class="mobile-nav"
        id="mobileNav"
        role="dialog"
        aria-modal="true"
        aria-label="Navigation menu"
      >
        <button
          class="mobile-nav-close"
          id="mobileNavClose"
          aria-label="Close navigation menu"
        >
          &times;
        </button>
        <a class="mobile-nav-home" href="/">Home</a>
        <a href="#">Explore</a>
        <a href="#">About Us</a>
        <div class="mobile-cta">
          <button class="mobile-signin">Sign In</button>
          <button class="mobile-signup">Sign For Free</button>
        </div>
      </div>
      <section class="home-inner">
        <div class="frame-parent">
          <div class="frame-wrapper">
            <div class="nutrition-details-parent">
              <div class="nutrition-details">
                <div class="info-details">
                  <h2 class="best-website-for">
                    # Best Website For Knowing Our Right Diet
                  </h2>
                </div>
              </div>
              <div class="simply-your-diet">
                Simply Your Diet and get more <br />Nutrition details with our
                platform
              </div>
            </div>
          </div>
          <div class="search-bar">
            <div class="search-elements">
              <img class="search-icon" alt="Search" src="./public/search.svg" />

              <div class="your-email-address">Your Email Address</div>
            </div>
            <button class="start-for-free-wrapper" id="frameButton">
              <div class="start-for-free">Start For Free</div>
            </button>
          </div>
        </div>
      </section>
      <main class="frame-group">
        <div class="rate-parent">
          <div class="rate">
            <h3 class="ratings-50">Ratings 5.0</h3>
            <div class="trusted-by-clients">
              Trusted by clients from worldwide
            </div>
          </div>
          <div class="active-users">
            <div class="user1">
              <h2 class="a">A</h2>
            </div>
            <div class="user12">
              <h2 class="a">V</h2>
            </div>
            <div class="user13">
              <h2 class="a">S</h2>
            </div>
            <div class="user14">
              <h2 class="a">K</h2>
            </div>
            <div class="user15">
              <h2 class="a">D</h2>
            </div>
            <div class="user16">
              <h3 class="k2">+1K</h3>
            </div>
          </div>
        </div>
      </main>
      <img
        class="image-3-icon"
        loading="lazy"
        alt="Fresh vegetables, fruits, and healthy foods spread out on a surface"
        src="./images/vegetablesnobg.png"
      />
    </div>

    <script>
      // Hamburger menu toggle
      var hamburgerBtn = document.getElementById('hamburgerBtn');
      var mobileNav = document.getElementById('mobileNav');
      var mobileNavClose = document.getElementById('mobileNavClose');

      if (hamburgerBtn && mobileNav) {
        hamburgerBtn.addEventListener('click', function () {
          mobileNav.classList.add('open');
          hamburgerBtn.setAttribute('aria-expanded', 'true');
          document.body.style.overflow = 'hidden';
        });
        mobileNavClose.addEventListener('click', function () {
          mobileNav.classList.remove('open');
          hamburgerBtn.setAttribute('aria-expanded', 'false');
          document.body.style.overflow = '';
        });
      }

      var exploreText = document.getElementById("exploreText");
      if (exploreText) {
        exploreText.addEventListener("click", function (e) {
          window.location.href="exp1.html";
        });
      }

      var aboutUsText = document.getElementById("aboutUsText");
      if (aboutUsText) {
        aboutUsText.addEventListener("click", function (e) {
          window.location.href="aboutus.html";
        });
      }

      var signInText = document.getElementById("signInText");
      if (signInText) {
        signInText.addEventListener("click", function (e) {
          window.location.href="exp1.html";
        });
      }

      var signForFreeText = document.getElementById("signForFreeText");
      if (signForFreeText) {
        signForFreeText.addEventListener("click", function (e) {
          window.location.href="exp1.html";
        });
      }

      var frameButton = document.getElementById("frameButton");
      if (frameButton) {
        frameButton.addEventListener("click", function (e) {
          window.location.href="exp1.html";
        });
      }
    </script>
  </body>
</html>
